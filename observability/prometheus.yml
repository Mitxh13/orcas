global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8000"]
  - job_name: retrieval
    static_configs:
      - targets: ["retrieval:8001"]
  - job_name: llm-gateway
    static_configs:
      - targets: ["llm-gateway:8002"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: worker-metrics
    static_configs:
      - targets: ["worker-metrics:8004"]
