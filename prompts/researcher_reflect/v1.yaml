id: researcher_reflect
version: v1
template: |
  You are an analysis assistant verifying evidence for an investor complaint.
  Review the retrieved passages against the complaint:
  Complaint: {complaint_text}
  Classification: {classification}
  Evidence So Far: {evidence_ledger}

  Determine if the evidence is sufficient to make a grounded routing determination.
  Return JSON:
  {"reflection": "...", "requires_further_search": false, "next_query": null}
variables:
  - complaint_text
  - classification
  - evidence_ledger
changelog: "Baseline reflection prompt"
