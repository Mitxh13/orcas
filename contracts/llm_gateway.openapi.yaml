openapi: 3.0.3
info:
  title: ORCAS LLM Gateway API
  description: Provider adapter, circuit breaker, cost accounting and retry layer for LLM requests
  version: 1.0.0
paths:
  /v1/chat:
    post:
      summary: Send a chat completion request to the configured LLM provider
      operationId: chatCompletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Successful completion response with usage and cost accounting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '422':
          description: Validation error
        '502':
          description: Provider failure / circuit breaker open
        '504':
          description: Gateway timeout
  /health:
    get:
      summary: Health check endpoint
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  circuit_breaker:
                    type: string
                    example: closed

components:
  schemas:
    ChatMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          type: string
        name:
          type: string

    ChatRequest:
      type: object
      required:
        - messages
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        model:
          type: string
          description: Override default model identifier
        temperature:
          type: number
          default: 0.0
        max_tokens:
          type: integer
          default: 2048
        run_id:
          type: string
          description: Run identifier for correlation and cost attribution
        agent:
          type: string
          description: Calling agent (researcher, verifier, etc.)
        step:
          type: string
          description: Execution step or node name
        prompt_version:
          type: string
          description: Version tag of prompt used

    ChatUsage:
      type: object
      required:
        - prompt_tokens
        - completion_tokens
        - total_tokens
        - cost_usd
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
        cost_usd:
          type: number
          format: float

    ChatChoice:
      type: object
      required:
        - index
        - message
        - finish_reason
      properties:
        index:
          type: integer
        message:
          $ref: '#/components/schemas/ChatMessage'
        finish_reason:
          type: string
          example: stop

    ChatResponse:
      type: object
      required:
        - id
        - choices
        - usage
        - model
        - degraded
      properties:
        id:
          type: string
        choices:
          type: array
          items:
            $ref: '#/components/schemas/ChatChoice'
        usage:
          $ref: '#/components/schemas/ChatUsage'
        model:
          type: string
        degraded:
          type: boolean
          description: True if response was generated by fallback model, stub, or cache
